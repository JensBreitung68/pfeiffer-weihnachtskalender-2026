<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pfeiffer Adventskalender 2026</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;background:radial-gradient(ellipse at top,#27504d 0,#102c30 42%,#091c25 100%);min-height:100vh}header{text-align:center;padding:38px 16px 18px}h1{font-size:clamp(2rem,5vw,4rem);margin:8px 0;font-family:Georgia,serif;color:#ffe6a6}header p{color:#e3ede9;line-height:1.5}.brand{letter-spacing:.22em;color:#ffd27b;font-size:.83rem;font-weight:800}.shell{max-width:1100px;margin:auto;padding:10px 18px 60px}.notice{text-align:center;margin:0 auto 22px;color:#f9e3b5;font-size:.94rem}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.door{position:relative;min-height:150px;aspect-ratio:4/4.1;border:2px solid #b68c43;border-radius:12px;overflow:hidden;background:linear-gradient(145deg,#b7322e,#711c25 65%,#3d1b28);box-shadow:0 8px 20px #0006;cursor:pointer;color:#fff;transition:transform .2s,border-color .2s}.door:hover{transform:translateY(-3px);border-color:#ffdf90}.door:focus-visible{outline:3px solid #fff;outline-offset:3px}.door::before{content:'✦';position:absolute;top:12px;left:13px;color:#f8d18c;font-size:20px}.door::after{content:'❄';position:absolute;bottom:10px;right:12px;color:#f8d18c;font-size:23px}.door strong{display:block;font:700 clamp(2.5rem,6vw,5rem) Georgia,serif;text-shadow:0 4px 9px #2c0918;margin:0}.door small{display:block;max-width:100%;font-size:clamp(.58rem,1.5vw,.78rem);letter-spacing:.025em;text-transform:uppercase;line-height:1.35;white-space:normal;overflow-wrap:normal;padding:0 5px}.door{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px 8px 24px}.door::after{bottom:5px;right:8px;font-size:16px;opacity:.7}.door.unlocked{background:linear-gradient(#0006,#0009),var(--thumb) center/cover}.door.unlocked strong{color:#fff}.door.locked{filter:saturate(.7)}.door.locked small{color:#eac9a7}.foot{text-align:center;color:#b7ccc9;font-size:.84rem;margin-top:24px}dialog{background:#122a30;border:2px solid #c89a51;color:white;border-radius:14px;padding:0;max-width:min(95vw,850px);max-height:94vh;box-shadow:0 20px 80px #000c}dialog::backdrop{background:#000b}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;gap:10px}.modal-head h2{margin:0;font-size:1.1rem;color:#ffe3a2}.close{border:1px solid #b18d54;background:#5a2529;color:white;border-radius:8px;padding:8px 13px;cursor:pointer;font-size:1rem}.photo{display:block;width:100%;max-height:75vh;object-fit:contain;background:#08161a}.locked-msg{text-align:center;padding:40px 22px;font-size:1.1rem}.snow{pointer-events:none;position:fixed;inset:0;opacity:.18;background-image:radial-gradient(white 1px,transparent 2px);background-size:41px 41px;z-index:-1}@media(max-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.door{min-height:112px}.shell{padding:10px 10px 40px}.door strong{font-size:clamp(2.3rem,9vw,3.1rem)}.door{gap:8px;padding:18px 5px 24px}.door small{font-size:clamp(.55rem,2.25vw,.72rem);letter-spacing:0}.door::after{font-size:13px;bottom:5px;right:7px}}@media(max-width:360px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><div class="snow"></div><header><div class="brand">PFEIFFER BAUGESELLSCHAFT · ROSENHEIM</div><h1>🎄 Adventskalender 2026 🎄</h1><p>24 Türchen voller Baustellen-Geschichten, Kollegen und Weihnachtsfreude.<br>Jeden Tag ein neues Türchen – vom 1. bis 24. Dezember.</p></header><main class="shell"><p class="notice" id="notice"></p><section class="grid" id="grid" aria-label="24 Adventstürchen"></section><p class="foot">Mit einem Augenzwinkern für alle Kollegen · Die Freigabe richtet sich nach dem Datum deines Geräts.</p></main><dialog id="viewer"><div class="modal-head"><h2 id="caption"></h2><button class="close" id="close" aria-label="Schließen">✕ Schließen</button></div><div id="content"></div></dialog><script>
const order=[1, 13, 2, 14, 3, 15, 4, 16, 5, 17, 6, 18, 7, 24, 8, 20, 9, 21, 10, 22, 11, 23, 12, 19],titles=["Weihnachtsgrüße vom Bau", "Schwebende Maurerkunst", "Der Plan fürs Fest", "Johns geheime Kammer", "Auf die Kollegen!", "Festgefahrene Situation", "Schneemann mit Bauhelm", "Pfeiffer hebt ab", "Stein auf Stein", "Alles im Blick", "Winter an der Pinakothek", "Bayerische Brotzeit", "Ein Paket fürs Team", "Handwerk nahezu perfekt", "Licht am Bau", "Gerüstbau mit Aussicht", "Feierabend am Feuer", "Manitou im Einsatz", "Der letzte Stein", "Kapitänsgrüße", "Münchner Winterabend", "Kollegen am Geländer", "Frohe Weihnachten!", "Gerüstbau mit Humor"],grid=document.getElementById('grid'),viewer=document.getElementById('viewer'),caption=document.getElementById('caption'),content=document.getElementById('content');
function currentDay(){const d=new Date();if(d.getFullYear()>2026)return 24;if(d.getFullYear()<2026)return 0;if(d.getMonth()<11)return 0;if(d.getMonth()>11)return 24;return Math.min(24,d.getDate())}
function draw(){const day=currentDay();document.getElementById('notice').textContent=day===0?'Noch ein bisschen Geduld: Das erste Türchen öffnet sich am 1. Dezember 2026.':day===24?'Alle 24 Türchen sind freigeschaltet. Frohe Weihnachten!':`Heute kannst du Türchen 1 bis ${day} öffnen.`;grid.replaceChildren();for(let n=1;n<=24;n++){let open=n<=day,b=document.createElement('button');b.type='button';b.className='door '+(open?'unlocked':'locked');b.style.setProperty('--thumb',`url("tuer_${String(order[n-1]).padStart(2,'0')}.jpg")`);b.setAttribute('aria-label',`Türchen ${n}: ${open?'öffnen':'noch verschlossen'}`);b.innerHTML=`<strong>${n}</strong><small>${open?'✨ Öffnen':'🔒 Gesperrt'}</small>`;b.onclick=()=>{const now=currentDay();if(n>now){caption.textContent=`Türchen ${n} ist noch verschlossen`;content.innerHTML=`<div class="locked-msg">🔒 Dieses Türchen öffnet sich am <b>${n}. Dezember 2026</b>.</div>`}else{caption.textContent=`${n}. Dezember · ${titles[n-1]}`;content.innerHTML='';let im=document.createElement('img');im.className='photo';im.alt=titles[n-1];im.src=`tuer_${String(order[n-1]).padStart(2,'0')}.jpg`;im.onerror=()=>{content.innerHTML='<div class="locked-msg">Das Bild konnte nicht geladen werden. Bitte prüfe, ob die Bilder im GitHub-Ordner <b>bilder</b> liegen.</div>'};content.append(im)}viewer.showModal()};grid.append(b)}}document.getElementById('close').onclick=()=>viewer.close();viewer.addEventListener('click',e=>{if(e.target===viewer)viewer.close()});draw();document.addEventListener('visibilitychange',()=>{if(!document.hidden)draw()});
</script></body></html>
